<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>i mad a website ;)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>random bs go</h1>
        <p>meow</p>
    </header>

    <main>
        <p>this is a website i made for fun. it has no real purpose, but i hope you enjoy it!</p>
        <p>uhhhhh this used to be from the firebot repo so this is my random bs repo now</p>
        <p>shi i made idk</p>
        <iframe
            src="nighttime_cityscape.svg"
            title="nighttime cityscape"
            style="width: 100%; height: 600px; border: none;">
        </iframe>
        <h2>i can haz tabby cats</h2>
        <label>
            firstname:
            <input type="text" id="firstName" value="Rainbow">
        </label>

        <br>

        <label>
            lastname:
            <input type="text" id="lastName" value="Cat">
        </label>

        <br>

        <label>
            Special:
            <select id="special">
                <option value="">None</option>
                <option value="Casper">Casper</option>
                <option value="Night">Night</option>
                <option value="Pinky">Pinky</option>
                <option value="Evil">Evil</option>
                <option value="Rainbow">Rainbow</option>
                <option value="Space">Space</option>
                <option value="Tiny">Tiny</option>
                <option value="Lil-404">Lil-404</option>
            </select>
        </label>

        <br>

        <label>
            Color:
            <select id="color">
                <option value="orange">Orange</option>
                <option value="white">White</option>
                <option value="gray">Gray</option>
                <option value="black" selected>Black</option>
                <option value="brown">Brown</option>
            </select>
        </label>

        <br>

        <label>
            Body:
            <input type="number" id="body" value="0" min="0" max="5">
        </label>

        <br>

        <label>
            Head:
            <input type="number" id="head" value="0" min="0" max="1">
        </label>

        <br>

        <label>
            Likes pets:
            <select id="likesPets">
                <option value="likes" selected>Likes</option>
                <option value="hates">Hates</option>
            </select>
        </label>

        <br>

        <label>
            Background:
            <select id="bgColor">
                <option value="light-blue" selected>Light Blue</option>
                <option value="red">Red</option>
                <option value="blue">Blue</option>
                <option value="light-purple">Light Purple</option>
                <option value="purple">Purple</option>
                <option value="green">Green</option>
                <option value="teal">Teal</option>
                <option value="yellow">Yellow</option>
                <option value="mauve">Mauve</option>
            </select>
        </label>

        <br><br>

        <button id="createCat">Create Cat</button>

        <p id="result"></p>
    </main>

    <script src="tabby.js"></script>
</body>
</html>
