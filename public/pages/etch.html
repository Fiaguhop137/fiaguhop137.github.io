<!DOCTYPE html>
<html>
    <head>
        <title>Etch-a-Sketch</title>
        <iframe src="../pages/header.html" style="width:100%;height:30px;overflow:hidden;border:none"></iframe>
    </head>
    <body style="background:#1e1e1e; color:#eee; font-family:sans-serif; text-align:center;">
        <p>Arrow keys/WASD to draw; Space to shake (clear)</p>
        <canvas id="c" width="1200" height="800" style="background:#fff; border:12px solid #c0392b; border-radius:12px;"></canvas>
        <script>
            const ctx=document.getElementById('c').getContext('2d');
            let x=600,y=400;
            ctx.lineWidth=3;
            ctx.lineCap='round';
            ctx.strokeStyle='#222';
            window.addEventListener('keydown',e =>{
                if (e.code==='Space') return ctx.clearRect(0,0,1200,800);
                ctx.beginPath();
                ctx.moveTo(x, y);
                if(e.key==='ArrowUp'||e.ke == 'w')y=Math.max(0,y-10);
                if(e.key==='ArrowDown'||e.ke == 's')y=Math.min(800,y+10);
                if(e.key==='ArrowLeft'||e.ke == 'a')x=Math.max(0,x-10);
                if(e.key==='ArrowRight'||e.ke == 'd')x=Math.min(1200,x+10);
                ctx.lineTo(x,y);
                ctx.stroke();
            });
        </script>
    </body>
</html>
