<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Frequently Asked Questions</title>
    <style>
        .faq-title{
            text-align:center;
            margin-bottom:24px;
            color:#321000;
        }
        details{
            background-color:#fedcba;
            border-radius:9px;
            margin-bottom:12px;
            padding:16px;
        }
        details:hover{background-color:#edcba9;}
        summary{
            font-weight:600;
            font-size:1.1rem;
            cursor:pointer;
            display:flex;
            justify-content:space-between;
            align-items:center;
            color:#654321;
        }
        summary::after{
            content:'+';
            font-size:1.4rem;
            font-weight:400;
            transition:transform 0.5s ease;
        }
        details[open] summary::after{transform: rotate(45deg);}
        .faq-answer {
            margin-top:12px;
            line-height:1.6;
            color:#987654;
        }
        .faq-answer p{margin:0;}
    </style>
</head>
<body>
    <a href="index.html">Back to main</a>
    <div class="faq-container">
        <h2 class="faq-title">Frequently Asked Questions</h2>
        <div id="qna"></div>
        <script>
            const qna=document.getElementById("qna");
            const qta={
                "How do I get my IAs/SIAs to stop harassing me?":
                    "placeholder",
                "Which students qualify for special needs services and which types?":
                    "placeholder",
                "How do I get rid of or add IEP and resource blocks?":
                    "placeholder",
                "What's the difference between IEP and 504 plans?":
                    "placeholder",
                "How do I get rid of or add 504 and resource blocks?":
                    "placeholder",
                "What do I do if a teacher refuses to give me the accommodations listed on my IEP/504 plan?":
                    "placeholder",
                "Can my school change or remove my IEP/504 accommodations without telling me or my parents?":
                    "placeholder",
                "Are accommodations a privilege or a necessity?":
                    "placeholder",
                "Who do I talk to if a parent requests an evaluation for special education services?":
                    "placeholder"
            }
            for(const [question,answer] of Object.entries(qta)){
                const newDetail=document.createElement("details");
                const newSummary=document.createElement("summary");
                newSummary.textContent=question;
                const newDivAnswer=document.createElement("div");
                newDivAnswer.classList.add("faq-answer");
                const newPara=document.createElement("p");
                newPara.textContent=answer;
                newDetail.append(newSummary);
                newDetail.append(newDivAnswer);
                newDivAnswer.append(newPara);
                qna.append(newDetail);
            }
        </script>
    </div>
</body>
</html>
